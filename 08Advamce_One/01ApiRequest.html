<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMLHttpRequest</title>
</head>
<body>
    <p> 0 |UNSENT               client has been created ,open() not called yet</p>
    <p>  1  | OPENED               open() has been called</p>
    <p> 2  | HEADER_RECEIVED      send() has been called and headers and status are vailable</p>
    <p>  3  | LOADING              Downloading; response text  holds data
       </p>
    <p> 4  | DONE                 The operation is completed</p>
    
</body>
<script>
    const requetUrl="https://api.github.com/users/muz1058";
  const xhr= new XMLHttpRequest()

  xhr.open("GET",requetUrl)


 xhr.onreadystatechange=function(){
    console.log(xhr.readyState);
    if(xhr.readyState===4){
        const data=JSON.parse(this.responseText);
        console.log(data);
        console.log(typeof(data));
        console.log(data.followers);
        console.log(data.avatar_url);
        console.log(data.bio);
        console.log(data.location);
        console.log(data.created_at);
        console.log(data.photo);
 }
 }

 


  xhr.send( )
</script>
</html>
